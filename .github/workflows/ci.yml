name: VORTEX CI Regression

on:
  push:
    branches: [ "fix/trades-api-remediation-1" ]
  pull_request:
    branches: [ "fix/trades-api-remediation-1" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify critical imports
        run: python -c "import numpy; import pandas; print('Core dependencies OK')"
      - name: Run regression suite
        run: python -m pytest -v tests/ --junitxml=results.xml
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: results.xml

  win-runtime-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Verify Dependencies
        shell: python
        run: |
          import sys
          try:
              import numpy
              print("NumPy: OK")
          except ImportError as e:
              print(f"NumPy Import Failed: {e}")
              sys.exit(1)
          
          try:
              import MetaTrader5 as mt5
              print(f"MT5: {mt5.__version__}")
          except ImportError:
              print("MetaTrader5: Expected failure (no terminal environment)")
      - name: Run safe tests
        run: python -m pytest tests/test_broker_mapping.py tests/test_account_isolation.py --junitxml=results.xml
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: results.xml
          if-no-files-found: ignore
